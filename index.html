<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyline Weather</title>
<meta name="description" content="Ad-free forecast from the National Weather Service">
<meta name="theme-color" content="#1d3b57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1720" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column; a deep sky "now" band, then readout sections on a paper ground. */
:root{
  --sky:#1d3b57; --sky-2:#2c5a80; --on-sky:#f3f7fb; --on-sky-dim:#b9cbdc;
  --bg:#eef2f5; --card:#ffffff; --fg:#14202b; --dim:#5b6b79; --line:#d8e0e7;
  --accent:#e08a2c; --rain:#2f7fc4; --cold:#3b78b5; --warm:#d9662b;
  --good:#3a9d5d; --mod:#d6a21e; --usg:#e07b24; --bad:#cc3b3b; --vbad:#8e3b9e; --haz:#7a2632;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0d1720; --sky-2:#16283a; --on-sky:#eaf1f7; --on-sky-dim:#8fa6ba;
  --bg:#0a1219; --card:#121e29; --fg:#e4ebf1; --dim:#8c9dac; --line:#223241;
  --accent:#f0a24c; --rain:#5aa7e8; --cold:#6aa3dc; --warm:#f08a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0d1720; --sky-2:#16283a; --on-sky:#eaf1f7; --on-sky-dim:#8fa6ba;
  --bg:#0a1219; --card:#121e29; --fg:#e4ebf1; --dim:#8c9dac; --line:#223241;
  --accent:#f0a24c; --rain:#5aa7e8; --cold:#6aa3dc; --warm:#f08a52; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Now band */
.now{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 100%);color:var(--on-sky);padding-block:10px 22px}
.bar{display:flex;align-items:center;gap:8px}
.loc{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;text-align:left;cursor:pointer}
.loc strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc svg{flex:none;opacity:.8}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;color:var(--on-sky)}
.iconbtn:active{background:rgba(255,255,255,.16)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-top:6px}
.temp{font-size:104px;line-height:.9;font-weight:500;letter-spacing:-2px}
.temp sup{font-size:40px;vertical-align:top;position:relative;top:10px;margin-left:2px;font-weight:400}
.cond{font-size:20px;margin-top:6px}
.sub{color:var(--on-sky-dim);font-size:15px}
.heroicon svg{width:110px;height:110px}
.hilo{display:flex;gap:14px;margin-top:8px;font-size:15px;color:var(--on-sky-dim);flex-wrap:wrap}
.hilo b{color:var(--on-sky);font-weight:700}
.stamp{font-size:12px;color:var(--on-sky-dim);margin-top:10px;letter-spacing:.02em}

.alert{display:block;margin-top:14px;background:var(--bad);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;border:0;width:100%;text-align:left;cursor:pointer}
.alert b{display:block;font-size:15px}
.alert p{margin:8px 0 0;white-space:pre-line;font-size:13px}

main{padding-block:8px 40px;display:flex;flex-direction:column;gap:26px}
h2{font:600 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font:400 12px var(--body);letter-spacing:0;text-transform:none}

/* Day parts */
.parts{display:flex;flex-direction:column;gap:10px}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:4px 12px}
.part .pic svg{width:48px;height:48px}
.part h3{margin:0;font:600 20px/1.1 var(--display);letter-spacing:.02em;display:flex;justify-content:space-between;gap:8px}
.part h3 span{color:var(--dim);font-weight:500}
.part p{margin:2px 0 0;font-size:15px}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--card))}

/* Wear */
.wear{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.wear ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wear li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.wear li i{font-style:normal;font-size:20px;line-height:1.2;text-align:center}
.wear li b{display:block}
.wear li span{color:var(--dim);font-size:14px}

/* Details */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tile .v{font:500 34px/1.05 var(--display);margin-top:4px}
.tile .v small{font-size:18px;color:var(--dim);margin-left:2px}
.tile .n{font-size:13px;color:var(--dim);margin-top:2px}
.tile.wide{grid-column:1/-1}
.aqi-bar{height:6px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--good) 0 16%,var(--mod) 16% 33%,var(--usg) 33% 50%,var(--bad) 50% 66%,var(--vbad) 66% 83%,var(--haz) 83%);position:relative}
.aqi-bar i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.sunarc{display:block;width:100%;max-width:240px;height:auto;margin:6px auto 0}
.sunrow{display:flex;justify-content:space-between;font-size:14px;margin-top:2px}
.sunrow b{font:500 22px var(--display)}
.compass{display:inline-block;transition:transform .3s}

/* Hourly */
.hscroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;scrollbar-width:thin;overscroll-behavior-x:contain}
.hinner{position:relative;display:flex;width:max-content;padding:10px 4px 12px}
.hcol{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;position:relative;z-index:1}
.hcol .t{color:var(--dim);font-size:12px;height:16px}
.hcol.day0 .t{color:var(--fg);font-weight:700}
.hcol svg.ic{width:30px;height:30px;margin:2px 0}
.hcol .tp{font:600 19px var(--display);margin-top:58px}
.hcol .pp{color:var(--rain);font-size:12px;height:16px}
.hcol .ws{color:var(--dim);font-size:12px}
.hcol.newday{border-left:1px dashed var(--line)}
.hcurve{position:absolute;left:4px;top:66px;height:56px;pointer-events:none}

/* Daily */
.days{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dayrow{display:grid;grid-template-columns:62px 32px 40px 1fr;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer}
.dayrow .dn{font-weight:700}
.dayrow svg{width:32px;height:32px}
.dayrow .pp{color:var(--rain);font-size:13px;text-align:right}
.range{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:8px;font:600 18px var(--display)}
.range .lo{color:var(--dim);text-align:right}
.track{height:6px;background:var(--line);border-radius:3px;position:relative}
.track i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--warm))}
.daydetail{padding:0 14px 14px;font-size:14px;color:var(--fg)}
.daydetail p{margin:0 0 8px}
.daydetail b{font-family:var(--display);font-size:16px;letter-spacing:.04em}

/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(5,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.panel h3{margin:0 0 12px;font:600 22px var(--display)}
.panel input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;margin-top:8px}
.btn.primary{background:var(--sky-2);color:var(--on-sky);border-color:transparent}
.btn small{color:var(--dim);margin-left:auto}
.btn .x{margin-left:auto;padding:0 6px;color:var(--dim)}
.list{margin-top:4px}
.msg{padding:28px 0;text-align:center;color:var(--dim)}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--card));border-radius:12px;padding:12px 14px;font-size:14px}
footer{font-size:12px;color:var(--dim);text-align:center;padding-bottom:24px}
footer a{color:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.temp{font-size:84px}.heroicon svg{width:84px;height:84px}}
</style>
</head>
<body>
<header class="now">
  <div class="wrap">
    <div class="bar">
      <button class="loc" id="locBtn" aria-label="Change location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <strong id="placeName">Finding your location…</strong>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="iconbtn" id="gpsBtn" aria-label="Use my location">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="iconbtn" id="refreshBtn" aria-label="Refresh">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div id="nowBody"><div class="msg" style="color:var(--on-sky-dim)">Loading the forecast…</div></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap">
  Forecast, observations and alerts: <a href="https://www.weather.gov" target="_blank" rel="noopener">National Weather Service</a>.
  Air quality: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (CAMS model).
  Sunrise and sunset are calculated on your device.
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Choose a location</h3>
    <button class="btn primary" id="sheetGps">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      Use my current location
    </button>
    <form id="searchForm" style="margin-top:14px">
      <input id="searchInput" type="search" placeholder="Search a US city or ZIP" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="list" id="results"></div>
    <div class="list" id="saved"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
